[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merchbot"
version = "0.2.0"
description = "Asistente conversacional de stock para merchandising: Gemini + function calling sobre SQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agustín Vignau" }]
dependencies = [
    "python-dotenv>=1.0.1",
    "google-genai>=0.8.0,<2.0",
    "python-telegram-bot>=21.6,<23",
    "sqlalchemy>=2.0.36,<2.1",
    "requests>=2.32.3,<3",
    "pydantic>=2.11,<3",           # 2.11+ trae ruedas para Python 3.13 y 3.14
    "pydantic-settings>=2.6,<3",
    "APScheduler>=3.10.4,<4",
    "openpyxl>=3.1,<4",
    "tzdata",                      # zonas horarias en Windows
    "numpy>=1.26",                 # similitud de coseno del RAG
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27,<1", "vaderSentiment>=3.3"]
# Sentimiento con transformers (RoBERTuito). Pesado: instala PyTorch.
nlp = ["transformers>=4.40,<5", "torch>=2.2"]

[project.scripts]
merchbot = "merchbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merchbot = ["interfaces/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = ["integration: tests que tocan APIs externas (skip por default)"]
asyncio_default_fixture_loop_scope = "function"
