<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar a MerchBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #F2F4F6; --superficie: #FFFFFF; --tinta: #18212E; --tinta-suave: #4A5568;
    --linea: #D6DCE3; --magenta: #C8175D; --magenta-hover: #A3124B; --cian: #0E7490; --amarillo: #F2C230;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--papel);
         color: var(--tinta); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; padding: 1rem; }
  :focus-visible { outline: 3px solid var(--cian); outline-offset: 2px; }
  main { width: 100%; max-width: 23rem; background: var(--superficie); border: 1px solid var(--linea);
         border-left: 5px solid var(--magenta); border-radius: 4px 14px 14px 4px; padding: 1.6rem 1.5rem; }
  h1 { font-family: "Familjen Grotesk", "Segoe UI", sans-serif; font-size: 1.5rem; margin: 0 0 0.25rem;
       display: flex; align-items: center; gap: 0.5rem; }
  .punto { width: 0.75rem; height: 0.75rem; border-radius: 50%;
           background: conic-gradient(var(--cian) 0 33%, var(--magenta) 0 66%, var(--amarillo) 0); }
  p { margin: 0 0 1.2rem; color: var(--tinta-suave); }
  label { display: flex; flex-direction: column; gap: 0.3rem; font-weight: 700; font-size: 0.92rem; margin-bottom: 0.9rem; }
  input { font: inherit; font-weight: 400; padding: 0.6rem 0.75rem; border: 1px solid var(--linea);
          border-radius: 8px; background: var(--papel); color: var(--tinta); }
  button { font: inherit; width: 100%; padding: 0.65rem; border: none; border-radius: 8px;
           background: var(--magenta); color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--magenta-hover); }
  button:disabled { background: #B9C1CC; cursor: progress; }
  .error { color: var(--magenta-hover); font-size: 0.92rem; margin: 0 0 0.9rem; }
</style>
</head>
<body>
  <main>
    <h1><span class="punto" aria-hidden="true"></span>MerchBot</h1>
    <p>Ingresá con el usuario que te dio el administrador.</p>
    <form id="form">
      <label>Usuario <input id="usuario" autocomplete="username" required maxlength="64" autofocus></label>
      <label>Clave <input id="clave" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p class="error" id="error" role="alert" hidden></p>
      <button id="btn" type="submit">Ingresar</button>
    </form>
  </main>
<script>
  const form = document.getElementById("form"), btn = document.getElementById("btn"), error = document.getElementById("error");
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    btn.disabled = true; error.hidden = true;
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ usuario: document.getElementById("usuario").value, clave: document.getElementById("clave").value }),
      });
      if (r.ok) { location.replace("/"); return; }
      const datos = await r.json().catch(() => ({}));
      error.textContent = typeof datos.detail === "string" ? datos.detail : "No pude ingresar. Probá de nuevo.";
      error.hidden = false;
      document.getElementById("clave").select();
    } catch (_) {
      error.textContent = "No hay conexión con el servidor."; error.hidden = false;
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
